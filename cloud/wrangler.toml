# Cloudflare Pages settings for the multi-user site (this folder is the project's root directory).
# The database ID only says which database to use; it opens nothing by itself. Secrets (TMDB_TOKEN, SIGNUP_CODE,
# PEPPER) are never written here: they live in the dashboard, under Settings → Variables and Secrets.
name = "film-diary"
pages_build_output_dir = "public"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "film-diary"
database_id = "3422fd7e-1515-4f8f-a3fa-8afc4b8b2341"
