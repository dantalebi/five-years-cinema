name: Discover catalog

# Builds the catalog behind TVC15's Discover tab (cloud/public/catalog/catalog.json): every film in
# cloud/catalog/seed.json matched on TMDB for its poster, directors, countries and genres, plus the rest of each
# movement's films from its directors' filmographies. What TMDB answered is kept in cloud/catalog/tmdb-cache.json,
# so later runs only ask about what's new. The push that saves it is what puts the new catalog on the site.
# Needs one secret, TMDB_TOKEN: TMDB's "API Read Access Token".
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog.yml', 'cloud/catalog/build.mjs', 'cloud/catalog/taxonomy.mjs', 'cloud/catalog/seed.json']

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the catalog
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node cloud/catalog/build.mjs
      # also after a failed or cut-short run: what TMDB already answered is kept, so the next run picks up from there
      - name: Save it
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cloud/catalog cloud/public/catalog
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Discover catalog, rebuilt from TMDB"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
