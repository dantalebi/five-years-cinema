name: Letterboxd → diary

# Every three hours, new logs from letterboxd.com/<you>/rss/ come into the app's diary.
# Setup: Settings → Secrets and variables → Actions → New repository secret
#   Name: FY_GIST_TOKEN   Value: a GitHub token with only the "gist" scope (Expiration: No expiration)
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bring new Letterboxd logs into the diary
        env:
          LB_USER: talebi
          GIST_TOKEN: ${{ secrets.FY_GIST_TOKEN }}
        run: node tools/letterboxd-sync.cjs
      # GitHub pauses schedules in repositories with no activity for 60 days; a quiet commit now and then keeps it running
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the Letterboxd import running"
            git push
          fi
